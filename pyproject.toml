[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coding_agent"
version = "0.1.43"
description = "Coding Agent"
dependencies = [
    "openai",
    "langsmith",
    "python-dotenv",
    "lancedb",
    "pyarrow",
    "tree-sitter",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "sentence-transformers",
    "tiktoken",
]

[project.scripts]
coding-agent = "coding_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    "ignore:langsmith.wrappers._openai_agents is deprecated:DeprecationWarning",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio",
    "pydantic",
]
